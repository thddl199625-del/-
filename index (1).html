let C=null,i=0,t=0,m=0,f=0,tags=[];const $=s=>document.querySelector(s);chars.forEach(c=>{let b=document.createElement('button');b.className='char';b.innerHTML=`<div class="emoji">${c.emoji}</div><b>${c.name}</b><div class="muted">${c.desc}</div>`;b.onclick=()=>start(c);$('#chars').appendChild(b)});
function start(c){C=c;i=t=m=f=0;tags=[];$('#start').style.display='none';$('#game').style.display='block';$('#end').style.display='none';$('#reset').style.display='block';$('#avatar').textContent=c.emoji;$('#name').textContent=c.name;$('#desc').textContent=c.desc;stats();render()}
function stats(){$('#time').textContent=t;$('#money').textContent=m.toLocaleString();$('#fatigue').textContent=f;$('#tags').innerHTML=tags.map(x=>`<span class="tag">${x}</span>`).join('')}
function render(){let a=S[C.id],s=a[i];$('#road').innerHTML=a.map((x,j)=>`<div class="node ${j===i?'on':''}">${x[1]} ${x[0]}</div>${j<a.length-1?'→':''}`).join('');$('#stage').textContent=`${i+1} / ${a.length} · ${s[3]}`;$('#icon').textContent=s[1];$('#title').textContent=s[0];$('#text').textContent=s[2];$('#feedback').style.display='none';$('#next').style.display='none';let box=$('#opts');box.innerHTML='';s[4].slice(0,4).forEach((raw,k)=>{let [lab,dt,dm,df,fb]=raw.split('|'),b=document.createElement('button');b.className='opt';b.textContent=`${String.fromCharCode(65+k)}. ${lab}`;b.onclick=()=>choose(b,+dt,+dm,+df,fb,s[3]);box.appendChild(b)})}
function choose(b,dt,dm,df,fb,tag){document.querySelectorAll('.opt').forEach(x=>x.disabled=true);b.style.border='2px solid #52634b';t+=dt;m+=dm;f+=df;if(!tags.includes(tag))tags.push(tag);stats();$('#feedback').innerHTML=`<b>결과</b><br>${fb}<br><span class="muted">+${dt}분 · +${dm.toLocaleString()}원 · 피로 +${df}</span>`;$('#feedback').style.display='block';$('#next').style.display='block';$('#next').textContent=i===S[C.id].length-1?'집에 도착하기 →':'다음 장소로 →'}
$('#next').onclick=()=>{i++;if(i>=S[C.id].length)finish();else render()};function finish(){$('#game').style.display='none';$('#end').style.display='block';$('#endtitle').textContent=`${C.name}, 오늘의 귀가 완료`;$('#endsummary').textContent='집에 도착했지만 이동 과정에서 개인의 노력만으로 없애기 어려운 여러 장벽을 만났다.';$('#etime').textContent=t+'분';$('#emoney').textContent=m.toLocaleString()+'원';$('#efatigue').textContent=f;$('#analysis').textContent=`오늘 확인한 요소: ${tags.join(', ')}. 하나의 불리한 조건이 교육·건강·이동·정보·문화 등 다른 영역의 격차와 연결될 수 있다. 이것이 사회 불평등이 ‘다중 격차’로 나타나는 모습이다.`}
function reset(){C=null;i=t=m=f=0;tags=[];$('#start').style.display='block';$('#game').style.display='none';$('#end').style.display='none';$('#reset').style.display='none'}$('#reset').onclick=reset;$('#again').onclick=reset;
</script></body></html>
